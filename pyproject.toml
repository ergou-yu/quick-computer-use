[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qcu"
version = "2.0.0"
description = "Quick Computer Use — a faster computer-use skill that prefers a11y trees over screenshots"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QCU contributors" }]
dependencies = [
    "playwright>=1.40",
]

[project.optional-dependencies]
macos = [
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]
windows = [
    "uiautomation>=2.0; sys_platform == 'win32'",
]
linux = [
    "python-xlib>=0.33; sys_platform == 'linux'",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
qcu = "qcu.cli:main"

[tool.setuptools.packages.find]
include = ["qcu*"]

[tool.setuptools.package-data]
qcu = ["assets/gnome/*/*.json", "assets/gnome/*/*.js"]

[tool.pytest.ini_options]
markers = [
    "integration: requires a real Chromium browser",
    "macos: requires macOS Accessibility permission",
    "windows: requires a real Windows interactive desktop and UIA",
    "linux: requires a Linux DBus/AT-SPI and X11 desktop",
]
testpaths = ["tests"]
