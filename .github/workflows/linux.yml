name: Linux AT-SPI and X11
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi gir1.2-atspi-2.0 gir1.2-gtk-3.0 at-spi2-core dbus-x11 xvfb openbox
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -e '.[linux,dev]' build pytest-timeout
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Allow the test browser's sandbox on this disposable runner
        run: |
          chromium=$(.venv/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile qcu-ci-chromium "%s" flags=(unconfined) {\n  userns,\n}\n' "$chromium" | sudo tee /etc/apparmor.d/qcu-ci-chromium >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/qcu-ci-chromium
      - name: Run real GTK, AT-SPI, X11 fixture
        run: |
          mkdir -p linux-evidence
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x1024x24' bash -c '
            export NO_AT_BRIDGE=0 GTK_MODULES=gail:atk-bridge XDG_SESSION_TYPE=x11
            openbox >linux-evidence/openbox.log 2>&1 &
            wm=$!
            trap "kill $wm 2>/dev/null || true" EXIT
            .venv/bin/python scripts/verify_linux_atspi.py --output linux-evidence/linux-live.json
          '
      - name: Diagnose browser startup
        if: always()
        run: |
          .venv/bin/python - <<'PY'
          import subprocess, tempfile
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              executable=p.chromium.executable_path
          with tempfile.TemporaryDirectory(prefix='qcu-chromium-probe-') as directory:
              result=subprocess.run([executable,'--headless=new','--user-data-dir='+directory,'--dump-dom','about:blank'],capture_output=True,text=True,timeout=15)
              print('Chromium probe exit:',result.returncode)
              print(result.stderr[-10000:])
          PY
      - name: Run regression suite
        run: |
          set -o pipefail
          .venv/bin/python -m pytest -q --timeout=60 --durations=15 | tee linux-evidence/pytest.txt
      - name: Build packages
        run: .venv/bin/python -m build
      - name: Print fixture diagnostics
        if: always()
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          path=Path('linux-evidence/linux-live.json')
          if path.exists():
              report=json.loads(path.read_text())
              print('Fixture error:',report.get('error'))
              for record in report.get('records',[]):
                  result=record.get('result',{})
                  print(record.get('command'), result.get('data',{}))
                  if 'elements' in result:
                      print('Tree:',[(e.get('role'),e.get('name'),e.get('value')) for e in result['elements']])
                      print('Read errors:',result.get('routing_meta',{}).get('read_errors'))
          for path in Path('linux-evidence').glob('*.fixture.log'):
              print(path.read_text()[-5000:])
          PY
      - name: Mirror disposable fixture evidence to job log
        if: always()
        run: |
          .venv/bin/python - <<'PY'
          import base64
          from pathlib import Path
          for name in ('linux-live.json','linux-before.png','linux-moved.png'):
              path=Path('linux-evidence')/name
              if path.exists():
                  data=path.read_bytes()
                  for index,start in enumerate(range(0,len(data),9000)):
                      print('QCU_EVIDENCE',name,index,base64.b64encode(data[start:start+9000]).decode())
          PY
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-evidence
          path: |
            linux-evidence/
            dist/
